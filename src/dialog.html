<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACE Editor</title>

    <link href="/node_modules/bootstrap/dist/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="style.css" rel="stylesheet" type="text/css" />

    <script src="/node_modules/ace-builds/src/ace.js" type="text/javascript"></script>
    <script src="/node_modules/ace-builds/src/ext-language_tools.js" type="text/javascript"></script>
    <script src="/node_modules/ace-builds/src/ext-emmet.js" type="text/javascript"></script>
    <script src="/node_modules/emmet-core/emmet.js" type="text/javascript"></script>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var languages = {
                "html": "HTML",
                "css": "CSS",
                "scss": "SCSS",
                "javascript": "JavaScript",
                "typescript": "TypeScript",
                "jsx": "JSX",
                "tsx": "TSX",
                "php": "PHP",
                "python": "Python",
                "bash": "Bash",
                "sql": "SQL",
                "json": "JSON",
                "xml": "XML",
                "markdown": "Markdown",
                "yaml": "YAML",
                "dockerfile": "Dockerfile",
                "mysql": "MySQL",
                "java": "Java",
                "c_cpp": "C/C++",
                "csharp": "C#",
                "go": "Go",
                "rust": "Rust",
                "ruby": "Ruby",
                "text": "Text",
            };
            var data = {
                mode: "html",
                code: "",
                width: "100%",
                height: "400px",
            };
            var editor = null;
            var modeSelect = document.querySelector('.js-mode');
            var widthInput = document.querySelector('.js-width');
            var heightInput = document.querySelector('.js-height');
            var codeEditorEl = document.getElementById('codeEditor');

            Object.keys(languages).forEach(function (key) {
                var option = document.createElement('option');
                option.value = key;
                option.textContent = languages[key];
                modeSelect.appendChild(option);
            });

            modeSelect.addEventListener('change', function () {
                data.mode = modeSelect.value;
                if (editor) {
                    editor.session.setMode("ace/mode/" + data.mode);
                }
            });
            widthInput.addEventListener('change', function () {
                data.width = widthInput.value;
                codeEditorEl.style.width = data.width;
                if (editor) {
                    editor.resize();
                }
            });
            heightInput.addEventListener('change', function () {
                data.height = heightInput.value;
                codeEditorEl.style.height = data.height;
                if (editor) {
                    editor.resize();
                }
            });

            window.addEventListener('message', function (event) {
                switch (event.data.mceAction) {
                    case 'init':
                        data.mode = event.data.mode;
                        data.width = event.data.width;
                        data.height = event.data.height;
                        data.code = event.data.code;

                        modeSelect.value = data.mode;
                        widthInput.value = data.width;
                        heightInput.value = data.height;
                        codeEditorEl.innerHTML = data.code;
                        codeEditorEl.style.width = data.width;
                        codeEditorEl.style.height = data.height;

                        ace.require("ace/ext/language_tools");
                        ace.require("ace/ext/emmet");
                        editor = ace.edit(codeEditorEl);
                        editor.getSession().setTabSize(4);
                        editor.session.setMode("ace/mode/" + data.mode);
                        editor.setOptions({
                            enableBasicAutocompletion: true,
                            enableSnippets: true
                        });
                        editor.setOption("enableEmmet", true);
                        data.code = editor.getValue();
                        editor.on("change", function () {
                            data.code = editor.getValue();
                        });
                        break;
                    case 'save':
                        window.parent.postMessage({
                            mceAction: "save",
                            mode: data.mode,
                            width: data.width,
                            height: data.height,
                            code: data.code,
                        }, '*');
                        break;
                }
            });

            window.parent.postMessage({
                mceAction: "init",
            }, '*');
        });
    </script>
</head>

<body>
    <div class="container-fluid py-3">
        <div class="row g-3 mb-3">
            <div class="col-12 col-md-4">
                <label class="form-label" for="aceMode">Language:</label>
                <select id="aceMode" name="type" class="form-select js-mode"></select>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label" for="aceWidth">Width:</label>
                <input id="aceWidth" class="form-control js-width" type="text" name="width" value="" />
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label" for="aceHeight">Height:</label>
                <input id="aceHeight" class="form-control js-height" type="text" name="height" value="" />
            </div>
        </div>
        <div class="mb-0">
            <label class="form-label" for="codeEditor">Code:</label>
            <div class="relative" id="codeEditor" style="width: 100%; height: 300px"></div>
        </div>
    </div>
</body>

</html>
